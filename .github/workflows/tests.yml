name: Run pytest

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # When changing this matrix, you have to change the "after_n_builds" parameter
        # in the .github/codecov.yml file. It must match the number of builds being
        # started considering the matrix. See the following links for more information:
        # https://docs.codecov.com/docs/notifications#preventing-notifications-until-after-n-builds
        # https://docs.codecov.com/docs/pull-request-comments#after_n_builds
        icalendar-version:
          - "5" # means (>=5.0.0,<6.0.0)
          - "6" # means (>=6.0.0,<7.0.0)
          - "7" # means (>=7.0.0,<8.0.0)
        dateutil-version:
          - "2" # means (>=2.0,<3.0)
          - "3" # means (>=3.0,<4.0)
          - "4" # means (>=4.0,<5.0)
        exclude:
          # python-dateutil 4 requires Python 3.11 or later
          - python-version: "3.10"
            dateutil-version: "4"
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install poetry"
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.1.2"

      - name: "Install icalendar ${{ matrix.icalendar-version }}, python-dateutil ${{ matrix.dateutil-version }} and other dependencies"
        run: |
          poetry add icalendar~=${{ matrix.icalendar-version }}.0 --no-interaction
          # Installed with pip: dateutil 4 needs Python 3.11+, which the
          # project-wide resolution of `poetry add` (Python 3.10+) rejects.
          poetry run pip install "python-dateutil~=${{ matrix.dateutil-version }}.0"

      - name: "Test with pytest"
        run: |
          poetry run coverage run test.py
          poetry run coverage xml

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v5
