name: Release

on:
  pull_request:
    branches: [master]
  push:
    tags:
    - '*'

permissions: {}

jobs:
  build:
    if: github.repository == 'eigenmannmartin/icalevents'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Checkout repository with all history for all branches and tags"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up latest Python 3 version"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: "Install poetry"
        uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd # v3
        with:
          poetry-version: "2.1.2"

      - name: "Build package"
        run: poetry build

      - name: "Store distributions"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      github.repository == 'eigenmannmartin/icalevents' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/icalevents/
    permissions:
      id-token: write

    steps:
      - name: "Download distributions"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: "Publish distributions to PyPI"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
